# Tool versions for local development and CI (jdx/mise-action reads this file).
# Bump versions here only; everything else picks them up.

[tools]
hugo = "0.167.0"
lychee = "0.24.2"
node = "22.12.0"
"npm:markdownlint-cli2" = "0.23.3"

[tasks.dev]
description = "Run the dev server with drafts, at http://localhost:1313"
run = "hugo server --buildDrafts --disableFastRender --renderToMemory"

[tasks.preview]
description = "Serve the site as it will go live (no drafts), at http://localhost:1313"
run = "hugo server --disableFastRender --renderToMemory"

[tasks.build]
description = "Production build into ./public (same command as CI)"
run = "hugo --gc --minify --panicOnWarning --cleanDestinationDir"

[tasks.lint]
description = "Lint Markdown files"
run = "markdownlint-cli2"

[tasks.links]
description = "Check every link in the build, internal and external (config: lychee.toml)"
depends = ["build"]
run = 'lychee --root-dir "$PWD/public" --no-progress "public/**/*.html"'

[tasks.check]
description = "Everything CI runs"
depends = ["lint", "links"]

[tasks."gen:syntax"]
description = "Regenerate assets/css/syntax.css (Chroma code colors, light + dark)"
# Each style is scoped to its own color scheme: a token styled in one theme
# but not the other must not leak across (e.g. near-black punctuation on dark).
run = '''
{
  echo "/* Generated by 'mise run gen:syntax' from Chroma's github and github-dark styles. Do not edit by hand. */"
  echo
  echo "@media (prefers-color-scheme: light) {"
  hugo gen chromastyles --style=github --omitClassComments | sed '1,2d' | sed 's/^/  /'
  echo "}"
  echo
  echo "@media (prefers-color-scheme: dark) {"
  hugo gen chromastyles --style=github-dark --omitClassComments | sed '1,2d' | sed 's/^/  /'
  echo "}"
} > assets/css/syntax.css
'''

[tasks."gen:og"]
description = "Regenerate assets/images/og.png (link-preview image) from tools/og-image.html"
# Needs Chrome or Chromium; set CHROME to its path if it isn't the macOS default.
run = '''
"${CHROME:-/Applications/Google Chrome.app/Contents/MacOS/Google Chrome}" \
  --headless=new --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
  --allow-file-access-from-files --virtual-time-budget=3000 \
  --window-size=1200,630 --screenshot="$PWD/assets/images/og.png" \
  "file://$PWD/tools/og-image.html"
'''
