name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly run to catch external links that broke since the last change.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the exact tool versions pinned in .mise.toml.
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0

      - name: Lint Markdown
        run: mise run lint

      - name: Build site
        run: mise run build

      - name: Check performance budget
        run: mise run budget

      - name: Check links
        run: mise run links
        env:
          # Avoids GitHub's rate limit on unauthenticated requests.
          GITHUB_TOKEN: ${{ github.token }}
