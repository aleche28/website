{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}
{{- with .Pages }}
  {{- range .GroupByDate "2006" }}
    <h2 class="section-title">{{ .Key }}</h2>
    {{ partial "post-list.html" .Pages }}
  {{- end }}
{{- else }}
  <p class="empty">{{ .Params.emptyMessage | default "Nothing here yet." }}</p>
{{- end }}
{{ end }}
