{{ define "main" }}
<article>
  <header class="post-header">
    <h1>{{ .Title }}</h1>
    {{- if eq .Section "blog" }}
      <p class="meta">
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 Jan 2006" }}</time>
        · {{ .ReadingTime }} min read
        {{- with .GetTerms "tags" }}
          ·<span class="tags">{{ range . }} <a href="{{ .RelPermalink }}">#{{ .Data.Term }}</a>{{ end }}</span>
        {{- end }}
      </p>
    {{- end }}
  </header>
  {{ .Content }}
</article>
{{ end }}
