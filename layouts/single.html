{{ define "main" }}
<article>
  <header>
    <h1>{{ .Title }}</h1>
    {{- if eq .Section "blog" }}
      <p class="meta">
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time>
        · {{ .ReadingTime }} min read
        {{- with .GetTerms "tags" }} ·
          {{- range . }} <a href="{{ .RelPermalink }}">#{{ .LinkTitle }}</a>{{ end }}
        {{- end }}
      </p>
    {{- end }}
  </header>
  {{ .Content }}
</article>
{{ end }}
