baseURL = "https://alessiochessa.dev/"
locale = "en-US"
title = "Alessio Chessa"

enableRobotsTXT = true

[params]
description = "Backend engineer working on delivery and observability. Writing Go."
role = "Backend engineer"

[params.social]
github = "https://github.com/aleche28"
linkedin = "https://www.linkedin.com/in/alessiochessa/"
email = "ale.chessa28@gmail.com"

[taxonomies]
tag = "tags"

# RSS only for the blog (enabled in content/blog/_index.md) and for each tag.
[outputs]
home = ["html"]
section = ["html"]
taxonomy = ["html"]
term = ["html", "rss"]

[markup.highlight]
noClasses = false

[markup.goldmark.renderer]
unsafe = false

# Posts opt in with `toc: true` in front matter.
[markup.tableOfContents]
startLevel = 2
endLevel = 3
ordered = false

# Resolve images in page bundles to full paths, so they also work in the feed.
[markup.goldmark.renderHooks.image]
useEmbedded = "fallback"

# Resolve site links in Markdown ([GrepDocs](/projects/grepdocs/)) to page
# URLs, so they keep working if the site is served from a subpath.
[markup.goldmark.renderHooks.link]
useEmbedded = "fallback"

[[menus.main]]
name = "Blog"
pageRef = "/blog"
weight = 10

[[menus.main]]
name = "Projects"
pageRef = "/projects"
weight = 20

[[menus.main]]
name = "About"
pageRef = "/about"
weight = 30
